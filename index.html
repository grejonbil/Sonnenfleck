<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFB627">
  <meta name="description" content="SonnenFleck — Wo scheint die Sonne gerade? Interaktive Karte für die Schweiz.">
  <title>SonnenFleck — Redesign</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">

  <style>
    html, body { background: #E8DDC4; height: 100%; }
    body { margin: 0; overflow: hidden; }
    #root { width: 100%; height: 100%; }
    .stage {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #E8DDC4;
      overflow: hidden;
    }
    /* JS sets --s on .device-fit; default to 1 */
    .device-fit {
      --s: 1;
      width: calc(402px * var(--s));
      height: calc(874px * var(--s));
      position: relative;
    }
    .device-fit > * {
      transform: scale(var(--s));
      transform-origin: top left;
      position: absolute;
      top: 0; left: 0;
    }
    .app { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="map.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sheet.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
